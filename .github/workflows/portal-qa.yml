name: Portal QA
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install browser tooling for QA only
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Exercise portal with isolated fixtures
        run: node scripts/qa/portal-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-qa
          path: qa-output/
          retention-days: 7
